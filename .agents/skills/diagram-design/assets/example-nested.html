    <h1>The CLAUDE.md Hierarchy</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nested-title nested-desc">
      <title id="nested-title">Atlas Accountants | Job-Costed Bookkeeping</title>
      <desc id="nested-desc">Nested diagram showing how project CLAUDE.md instructions inherit broader scopes from the global, vault, business, and marketing levels.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"></circle>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"></rect>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"></rect>

        <!-- Level 1: ~/.claude/ (global) — outermost -->
        <rect x="40" y="60" width="920" height="380" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.30)" stroke-width="1"></rect>
        <!-- Level 2: ~/vault/ -->
        <rect x="72" y="96" width="856" height="308" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"></rect>
        <!-- Level 3: /business -->
        <rect x="104" y="132" width="792" height="236" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.45)" stroke-width="1"></rect>
        <!-- Level 4: /marketing -->
        <rect x="136" y="168" width="728" height="164" rx="8" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"></rect>
        <!-- Level 5: /project — innermost, coral focal -->
        <rect x="168" y="204" width="664" height="92" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"></rect>

        <!-- Level labels on paper-colored masks -->
        <rect x="56" y="52" width="188" height="16" fill="#f5f5f5"></rect>
        <text x="64" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">~/.claude/ (global)</text>

        <rect x="88" y="88" width="148" height="16" fill="#f5f5f5"></rect>
        <text x="96" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">~/vault/ (notes)</text>

        <rect x="120" y="124" width="96" height="16" fill="#f5f5f5"></rect>
        <text x="128" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">/business</text>

        <rect x="152" y="160" width="108" height="16" fill="#f5f5f5"></rect>
        <text x="160" y="172" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">/marketing</text>

        <rect x="184" y="196" width="88" height="16" fill="#f5f5f5"></rect>
        <text x="192" y="208" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">/project</text>

        <!-- Glyph in level 1 (bottom-right area of outer ring) -->
        <g transform="translate(908, 408)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"></path>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="1"></path>
        </g>
        <!-- Glyph in level 2 ring -->
        <g transform="translate(876, 372)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="rgba(45,49,66,0.40)" stroke-width="1"></path>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1"></path>
        </g>
        <!-- Glyph in level 3 ring -->
        <g transform="translate(844, 336)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="rgba(45,49,66,0.50)" stroke-width="1"></path>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.50)" stroke-width="1"></path>
        </g>
        <!-- Glyph in level 4 ring -->
        <g transform="translate(812, 300)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"></path>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="#4f5d75" stroke-width="1"></path>
        </g>

        <!-- Innermost label — human readable -->
        <text x="500" y="248" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLAUDE.md</text>
